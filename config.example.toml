[signal]
# Replace with the source wallet. The system program is only a parseable placeholder.
wallet = "11111111111111111111111111111111"
# Pick the LaserStream region closest to the machine running this service.
laserstream_url = "https://laserstream-mainnet-ewr.helius-rpc.com/"
http_url = "https://mainnet.helius-rpc.com/"
commitment = "processed"
queue_capacity = 256

[signal.preconfirmations]
# Successful direct buys trigger early; LaserStream remains the fallback.
enabled = true
websocket_url = "wss://beta.helius-rpc.com/"

[routing]
timeout_ms = 2000

[http]
tcp_keepalive_seconds = 30
http2_keepalive_seconds = 20
http2_keepalive_timeout_seconds = 5
pool_idle_timeout_seconds = 90
max_idle_connections_per_host = 16

[mainnet]
# Source-only, source-price minimum output, fixed fee, no simulation or fee RPC.
skip = true
fixed_priority_fee_micro_lamports = 100000
sender_url = "https://sender.helius-rpc.com/fast?swqos_only=true"
tip_lamports = 5000
priority_level = "high"
max_priority_fee_micro_lamports = 5000000

# Opt-in durable nonce fan-out. Pre-create nonce accounts with the copier
# wallet as authority; reserve one account per simultaneous trade.
[mainnet.fanout]
enabled = false
nonce_accounts = []
submit_timeout_ms = 1500
routes = []

# To configure routes, remove `routes = []` above and add one or more:
# [[mainnet.fanout.routes]]
# name = "helius-ewr"
# url = "http://ewr-sender.helius-rpc.com/fast?swqos_only=true"
# tip_account = "4ACfpUFoaSD9bfPdeu6DBt89gB6ENTeHBXCAi87NhDEE"
# tip_lamports = 5000
# priority_fee_micro_lamports = 100000
#
# [[mainnet.fanout.routes]]
# name = "helius-global"
# url = "https://sender.helius-rpc.com/fast?swqos_only=true"
# tip_account = "D2L6yPZ2FmmmTKPgzaMKdhu6EWZcTpLy1Vhx8uvZe7NZ"
# tip_lamports = 5000
# priority_fee_micro_lamports = 150000

[storage]
database_url = "sqlite://copy_trader.sqlite?mode=rwc"

[execution]
target = "mainnet"
allow_live_mainnet = false
slippage_bps = 100
max_signal_age_seconds = 30
confirmation_timeout_seconds = 30
# Parallel preparation lanes share wallet reservations and submission limits.
preparation_workers = 4
# Up to this many Sender calls overlap.
max_concurrent_sends = 32

[sizing]
# Buy sizing; token-to-SOL exits mirror the source sold fraction of our holdings.
mode = "percent"
percent_bps = 100

# Safe default: only mints listed below may be traded.
[token_policy]
mode = "allowlist"

# To accept any safely inspectable mint, replace the section above with:
# [token_policy]
# mode = "all"
# minimum_input = "0.001"
# maximum_input = "0.05" # Larger sized copies are capped at this amount.
# Listed token rules remain optional overrides in all-token mode.

[[tokens]]
mint = "So11111111111111111111111111111111111111112"
minimum_input = "0.001"
maximum_input = "0.05" # Larger sized copies are capped at this amount.
